openapi: 3.1.0
info:
  title: Order Service API
  version: 0.0.1
  description: API for creating and querying purchase orders. Created orders are published to Kafka through the outbox pattern.
servers:
  - url: http://localhost:8081
    description: Local order-service
tags:
  - name: Orders
paths:
  /api/v1/orders:
    post:
      tags: [Orders]
      summary: Create an order
      description: Creates a purchase order in the local database and stores an outbox event that is later published to Kafka.
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
            example:
              customerId: customer-001
              items:
                - productId: product-001
                  quantity: 2
                  unitPrice: 49.90
                - productId: product-002
                  quantity: 1
                  unitPrice: 149.90
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
    get:
      tags: [Orders]
      summary: List orders
      operationId: listOrders
      responses:
        "200":
          description: Orders found
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrderResponse"
  /api/v1/orders/{id}:
    get:
      tags: [Orders]
      summary: Get an order by id
      operationId: getOrderById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Order found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "404":
          description: Order not found
components:
  schemas:
    CreateOrderRequest:
      type: object
      required: [customerId, items]
      properties:
        customerId:
          type: string
          minLength: 1
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/OrderItemRequest"
    OrderItemRequest:
      type: object
      required: [productId, quantity, unitPrice]
      properties:
        productId:
          type: string
          minLength: 1
        quantity:
          type: integer
          minimum: 1
        unitPrice:
          type: number
          minimum: 0
          exclusiveMinimum: true
    OrderResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        customerId:
          type: string
        status:
          $ref: "#/components/schemas/OrderStatus"
        totalAmount:
          type: number
        createdAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderLineResponse"
    OrderLineResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
        quantity:
          type: integer
        unitPrice:
          type: number
    OrderStatus:
      type: string
      enum: [CREATED, PAYMENT_APPROVED, PAYMENT_REJECTED]

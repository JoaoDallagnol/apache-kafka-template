server:
  port: 8083

spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:h2:mem:notifications;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: com.example.orderprocessing.notification.event

app:
  kafka:
    topics:
      orders-created:
        name: orders.created
      payments-processed:
        name: payments.processed

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
